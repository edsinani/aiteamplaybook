# The gates. Every PR runs these. Branch protection requires the "gates" job.
# Replace the build-and-test steps with the project's real commands; keep the
# pr-size and template checks as they are.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Count changed lines, excluding generated files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          # Generated files do not count. Add the project's own patterns.
          EXCLUDE=':(exclude)**/package-lock.json :(exclude)**/*.lock :(exclude)**/__snapshots__/** :(exclude)contracts/*.json :(exclude)**/Migrations/*.Designer.cs'
          LINES=$(git diff --numstat "$BASE" "$HEAD" -- . $EXCLUDE | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "Changed lines (excluding generated): $LINES"
          LIMIT=400
          if [ "$LINES" -gt "$LIMIT" ]; then
            if echo ",$LABELS," | grep -q ",size/xl-override,"; then
              echo "Over $LIMIT but size/xl-override is set. Reviewer: check the override reason in the PR body."
            else
              echo "::error::PR has $LINES changed lines, limit is $LIMIT. Split it, or add the size/xl-override label with a reason in the PR body. See docs/review-policy.md."
              exit 1
            fi
          fi

  pr-template:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require the verification section to be filled
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          for field in "Tracker: #" "Risk tier:" "Contract:" "## Verification"; do
            if ! printf '%s' "$BODY" | grep -q "$field"; then
              echo "::error::PR body is missing '$field'. Use the template."
              exit 1
            fi
          done
          if printf '%s' "$BODY" | grep -q '<paste the check output>'; then
            echo "::error::PR body still has the placeholder in the Verification section. Paste the real check output."
            exit 1
          fi
          if printf '%s' "$BODY" | grep -Eq 'Risk tier: *(Low \| Standard \| High|$)'; then
            echo "::error::Pick one risk tier."
            exit 1
          fi

  gates:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

