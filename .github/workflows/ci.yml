# The build gates. Every PR and every push to main runs these. Branch
# protection requires the "gates" job, plus "pr-size" and "pr-template" from
# pr-checks.yml.
#
# The gates job fails until its steps are replaced with the project's real
# build and test commands. A required check that passes without testing
# anything is worse than no check.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    if: github.repository != 'edsinani/aiteamplaybook'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO: replace with the project's real steps, then delete the
      # "Not configured" step. Examples for a three-service repo:
      #
      # - uses: actions/setup-dotnet@v4
      #   with: { dotnet-version: '10.0.x' }
      # - run: dotnet restore --locked-mode
      # - run: dotnet build --no-restore --configuration Release
      # - run: dotnet test --no-build --configuration Release
      #
      # - uses: actions/setup-python@v5
      #   with: { python-version: '3.12' }
      # - run: pip install -r worker/requirements.txt
      # - run: cd worker && pytest -q
      # - run: cd worker && python scripts/generate_field_manifest.py --check   # contract is current
      #
      # - uses: actions/setup-node@v4
      #   with: { node-version: '22' }
      # - run: cd frontend && npm ci && npm run type-check && npm test -- --run && npm run build

      - name: Not configured
        run: |
          echo "::error::The gates job has no build or test steps yet. Replace them in .github/workflows/ci.yml (README install step 7)."
          exit 1

  no-em-dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Team convention, in code, comments and docs
        run: |
          if git grep -nI $'\xe2\x80\x94'; then
            echo "::error::Em dash found. Use a hyphen or restructure the sentence."
            exit 1
          fi
