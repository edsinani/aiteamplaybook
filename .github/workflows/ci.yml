        run: echo "Replace this job's steps with the project's build and test commands."

  no-em-dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Team convention on docs
        run: |
          if grep -rn $'\xe2\x80\x94' --include='*.md' docs AGENTS.md CLAUDE.md README.md 2>/dev/null; then
            echo "::error::Em dash found. Use a hyphen or restructure the sentence."
            exit 1
          fi
