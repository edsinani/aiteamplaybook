# Paste this job into .github/workflows/pr-checks.yml, which re-runs when a
# label is added, and add it to the required checks in branch protection. It
# fails when a rule file changed in a pull request that does not carry the
# playbook-change label. The label is a flag for the reviewer; the lock is CODEOWNERS, which makes the lead approve the
# change either way.

  playbook-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Rule files change only with the playbook-change label
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "$BASE...$HEAD" -- AGENTS.md CLAUDE.md .claude .github \
            docs/constitution.md docs/review-policy.md docs/definition-of-done.md contracts)
          if [ -n "$CHANGED" ] && ! echo ",$LABELS," | grep -q ",playbook-change,"; then
            echo "::error::Rule files changed without the playbook-change label:"
            echo "$CHANGED"
            exit 1
          fi
